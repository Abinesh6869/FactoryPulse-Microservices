spring.application.name=fp-telemetry
server.port=9091

spring.datasource.url=jdbc:mysql://localhost:3306/fp_telemetry
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=FactoryPulseSecretKeyUsedToHashPasswordsBetterToUseALongHashToEncrypt

simulator.enabled=true
simulator.telemetry-tick-ms=5000
simulator.production-tick-ms=20000
simulator.good-count-per-tick=20
simulator.reject-rate=0.03

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Feign + Resilience4j circuit breaker
feign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3
