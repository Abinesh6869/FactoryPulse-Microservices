spring:
  application:
    name: fp-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_UNIQUE
      routes:

        # ── fp_identity ──────────────────────────────────────────────────────
        - id: identity-auth
          uri: lb://fp-identity
          predicates:
            - Path=/api/auth/**

        - id: identity-service
          uri: lb://fp-identity
          predicates:
            - Path=/api/users/**,/api/plants/**,/api/lines/**,/api/machines/**,/api/machine-docs/**,/api/telemetry-points/**,/api/shifts/**,/api/shift-allocations/**,/api/rootcauses/**,/api/alertrules/**,/api/audit-logs/**

        # ── fp_telemetry ─────────────────────────────────────────────────────
        - id: telemetry-service
          uri: lb://fp-telemetry
          predicates:
            - Path=/api/telemetry/**

        # ── fp_events ────────────────────────────────────────────────────────
        - id: events-service
          uri: lb://fp-events
          predicates:
            - Path=/api/downtimes/**,/api/alerts/**

        # ── fp_maintenance ───────────────────────────────────────────────────
        - id: maintenance-service
          uri: lb://fp-maintenance
          predicates:
            - Path=/api/workorders/**,/api/maintenance-logs/**

        # ── fp_reporting ─────────────────────────────────────────────────────
        - id: reporting-service
          uri: lb://fp-reporting
          predicates:
            - Path=/api/reports/**,/api/oee/**,/api/kpis/**,/api/quality-correlation/**,/api/throughput-forecasts/**

server:
  port: 8082

jwt:
  secret: FactoryPulseSecretKeyUsedToHashPasswordsBetterToUseALongHashToEncrypt
